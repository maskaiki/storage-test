services:
  - type: web
    name: telegram-vault-personal-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: PORT
        value: 3000
